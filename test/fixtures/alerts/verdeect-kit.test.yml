# Unittest vmalert-tool шаблона алертов (prd.md §3.2, AC-2.11): порог по умолчанию, переопределение по service и DLQ с
# двумя type у одного сервиса (без ошибки many-to-many); очистка (AC-9.5): error и partial — алерт, ok — нет. Пути — внутри контейнера (каталог /rules).
rule_files:
  - /rules/verdeect-kit.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # Сервис a — порог по умолчанию 5 с: 10 > 5, алерт есть.
      - series: 'verdeect_outbox_lag_seconds{service="a"}'
        values: '10x10'
      # Сервис b — свой порог 30 с: 10 < 30, алерта нет.
      - series: 'verdeect_outbox_lag_seconds{service="b"}'
        values: '10x10'
      - series: 'verdeect_kit_threshold:outbox_lag_seconds{service="b"}'
        values: '30x10'
      # DLQ: два type у одного сервиса — два алерта.
      - series: 'verdeect_events_consumed_total{service="a",type="x.created",result="dlq"}'
        values: '0+1x10'
      - series: 'verdeect_events_consumed_total{service="a",type="x.deleted",result="dlq"}'
        values: '0+2x10'
      # Пул БД: сервис c со своим порогом 100 — 9 < 100, алерта нет.
      - series: 'verdeect_db_pool_wait_timeouts_total{service="c",pool="main"}'
        values: '0+1x10'
      - series: 'verdeect_kit_threshold:db_pool_wait_timeouts{service="c"}'
        values: '100x10'
    alert_rule_test:
      - eval_time: 5m
        groupname: verdeect-kit
        alertname: VerdeectOutboxLag
        exp_alerts:
          - exp_labels:
              service: a
              severity: warning
            exp_annotations:
              summary: 'Задержка outbox a выше порога'
              description: >-
                Самая старая неотправленная строка outbox сервиса a ждёт дольше порога
                (verdeect_outbox_lag_seconds, по умолчанию 5 с) в течение минуты. Проверьте relay в журнале
                сервиса и доступность брокера.
      - eval_time: 5m
        groupname: verdeect-kit
        alertname: VerdeectEventsDlq
        exp_alerts:
          - exp_labels:
              service: a
              type: x.created
              severity: warning
            exp_annotations:
              summary: 'События x.created сервиса a уходят в DLQ'
              description: >-
                За 15 минут события x.created сервиса a попали в DLQ (verdeect_events_consumed_total,
                result="dlq"). Разберите сообщения очереди DLQ по журналу подписчика.
          - exp_labels:
              service: a
              type: x.deleted
              severity: warning
            exp_annotations:
              summary: 'События x.deleted сервиса a уходят в DLQ'
              description: >-
                За 15 минут события x.deleted сервиса a попали в DLQ (verdeect_events_consumed_total,
                result="dlq"). Разберите сообщения очереди DLQ по журналу подписчика.
      - eval_time: 5m
        groupname: verdeect-kit
        alertname: VerdeectDbPoolWaitTimeouts
        exp_alerts: []
  - interval: 1m
    input_series:
      # Очистка: d — проходы с ошибкой, e — неполные проходы, f — только ok (алерта нет).
      - series: 'verdeect_cleanup_runs_total{service="d",table="idempotency_key",result="error"}'
        values: '0+1x10'
      - series: 'verdeect_cleanup_runs_total{service="e",table="idempotency_key",result="partial"}'
        values: '0+1x10'
      - series: 'verdeect_cleanup_runs_total{service="f",table="idempotency_key",result="ok"}'
        values: '0+1x10'
      # Сервис g — свой порог 5: прирост 4 за 5 минут не выше порога, алерта нет.
      - series: 'verdeect_cleanup_runs_total{service="g",table="idempotency_key",result="error"}'
        values: '0+1x10'
      - series: 'verdeect_kit_threshold:cleanup_runs{service="g"}'
        values: '5x10'
    alert_rule_test:
      - eval_time: 5m
        groupname: verdeect-kit
        alertname: VerdeectCleanupFailing
        exp_alerts:
          - exp_labels:
              service: d
              table: idempotency_key
              result: error
              severity: warning
            exp_annotations:
              summary: 'Очистка idempotency_key сервиса d: error'
              description: >-
                За 2 часа проход очистки таблицы idempotency_key сервиса d завершился с итогом error
                (verdeect_cleanup_runs_total). error — проход упал: ошибка в журнале сервиса («очистка … :
                ошибка»). partial — проход упёрся в предел пачек, записи старше срока остались: очистка не
                успевает за потоком записей.
          - exp_labels:
              service: e
              table: idempotency_key
              result: partial
              severity: warning
            exp_annotations:
              summary: 'Очистка idempotency_key сервиса e: partial'
              description: >-
                За 2 часа проход очистки таблицы idempotency_key сервиса e завершился с итогом partial
                (verdeect_cleanup_runs_total). error — проход упал: ошибка в журнале сервиса («очистка … :
                ошибка»). partial — проход упёрся в предел пачек, записи старше срока остались: очистка не
                успевает за потоком записей.
